name: Spatial-Temporal CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
      - '!main'
  pull_request:
    branches:
      - main

jobs:
  call-workflow:
    uses: ./.github/workflows/_deploy-template.yml
    with:
      app-name: spatial-temporal
    secrets:
      cloudflare-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare-project-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
