name: Shared App CI/CD Template

on:
  workflow_call:
    inputs:
      app-name:
        description: 'Name of the Nx application to build, test and deploy'
        required: true
        type: string
    secrets:
      cloudflare-api-token:
        description: 'Cloudflare API Token for deployment'
        required: true
      cloudflare-account-id:
        description: 'Cloudflare Account ID for deployment'
        required: true
      carto-api-key:
        description: 'Carto API Key'
        required: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    # 1. Map workflow_call secrets and inputs to job-level environment variables
    env:
      CF_TOKEN: ${{ secrets.cloudflare-api-token }}
      CF_ACCOUNT_ID: ${{ secrets.cloudflare-account-id }}
      CARTO_KEY: ${{ secrets.carto-api-key }}

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # 1. Install dependencies first so the environment is ready
      - name: Install dependencies
        run: npm ci

      # 2. Inject Carto API key into carto-config.ts if provided
      - name: Create carto configuration
        if: env.CARTO_KEY != ''
        env:
          CARTO_KEY: ${{ secrets.carto-api-key }}
        run: |
          CONFIG_DIR="./libs/config/src"
          CONFIG_FILE="$CONFIG_DIR/carto-config.ts"

          mkdir -p "$CONFIG_DIR"

          node -e '
            const fs = require("node:fs");
            const key = process.env.CARTO_KEY;
            fs.writeFileSync(
              "libs/config/src/carto-config.ts",
              "export const CARTO_API_KEY = " +
                JSON.stringify(key) +
                ";\n"
            );
          '
          echo "Carto configuration generated."

      # 3. Run unit tests for the specific Nx app
      - name: Run unit tests
        run: npx nx test ${{ inputs.app-name }} --watch=false

      # 4. Build the application for production
      - name: Build application
        run: npx nx build ${{ inputs.app-name }}

      # 5. Deploy compiled bundle to Cloudflare Pages via wrangler-action
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: pages deploy apps/${{ inputs.app-name }}/dist/${{ inputs.app-name }}/browser --project-name=${{ inputs.app-name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
