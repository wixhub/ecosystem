name: Shared App CI/CD Template

on:
  workflow_call:
    inputs:
      app-name:
        description: 'Name of the Nx application to build, test and deploy'
        required: true
        type: string
    secrets:
      cloudflare-api-token:
        description: 'Cloudflare API Token for deployment'
        required: true
      cloudflare-account-id:
        description: 'Cloudflare Account ID for deployment'
        required: true
      carto-api-key:
        description: 'Carto API Key'
        required: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    # 1. Map workflow_call secrets and inputs to job-level environment variables
    env:
      CF_TOKEN: ${{ secrets.cloudflare-api-token }}
      CF_ACCOUNT_ID: ${{ secrets.cloudflare-account-id }}
      CARTO_KEY: ${{ secrets.carto-api-key }}

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # 2. Setup application environment config safely if the template exists
      - name: Create environment configuration
        run: |
          ENV_EXAMPLE="apps/${{ inputs.app-name }}/src/environments/environment.example.ts"
          ENV_FILE="apps/${{ inputs.app-name }}/src/environments/environment.ts"

          if [ -f "$ENV_EXAMPLE" ]; then
            cp "$ENV_EXAMPLE" "$ENV_FILE"
            echo "Environment config created from template for ${{ inputs.app-name }}."
          else
            echo "No environment template found for ${{ inputs.app-name }}, skipping this step."
          fi

      # 3. Inject Carto API key into carto-config.ts if provided, or fall back to template
      - name: Create carto configuration
        run: |
          CONFIG_DIR="libs/config/src"
          mkdir -p "$CONFIG_DIR"

          if [ -n "$CARTO_KEY" ]; then
            # Generate config directly using the provided repository secret
            echo "export const CARTO_API_KEY = '$CARTO_KEY';" > "$CONFIG_DIR/carto-config.ts"
            echo "Carto config generated successfully from GitHub secret."
          elif [ -f "$CONFIG_DIR/carto-config.example.ts" ]; then
            # Fallback to template if no secret was passed but template exists
            cp "$CONFIG_DIR/carto-config.example.ts" "$CONFIG_DIR/carto-config.ts"
            echo "Carto config created from template file."
          else
            echo "No Carto config secret or template provided, skipping."
          fi

      # 4. Install dependencies using clean install
      - name: Install dependencies
        run: npm ci

      # 5. Run unit tests for the specific Nx app
      - name: Run unit tests
        run: npx nx test ${{ inputs.app-name }} --watch=false

      # 6. Build the application for production
      - name: Build application
        run: npx nx build ${{ inputs.app-name }}

      # 7. Deploy compiled bundle to Cloudflare Pages via wrangler-action
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: pages deploy dist/apps/${{ inputs.app-name }} --project-name=${{ inputs.app-name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
