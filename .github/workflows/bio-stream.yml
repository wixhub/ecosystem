name: Bio-Stream CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
      - '!main'
  pull_request:
    branches:
      - main

jobs:
  call-workflow:
    uses: ./.github/workflows/_deploy-template.yml
    with:
      app-name: bio-stream
    secrets:
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      carto-api-key: ${{ secrets.CARTO_API_KEY }}
