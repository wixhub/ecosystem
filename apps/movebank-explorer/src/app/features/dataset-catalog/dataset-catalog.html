<div class="repository-container">
  <!-- Header Component with Signals Binding -->
  <app-header
    [aiPrompt]="aiPrompt()"
    [entityType]="entityType()"
    [studyId]="studyId()"
    [activeSource]="activeSource()"
    [datasetsCount]="datasets().length"
    (aiPromptChange)="aiPrompt.set($event)"
    (entityTypeChange)="entityType.set($event)"
    (studyIdChange)="studyId.set($event)"
    (aiSearch)="onAiSearch()"
    (loadLive)="loadCustomLiveQuery()"
    (loadMock)="loadMockData()"
    (reset)="resetFilters()"
  />

  <!-- Loading State Indicator -->
  @if (isLoading()) {
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Synchronizing repository records...</p>
    </div>
  }

  <!-- Error Notification Banner -->
  @if (errorMessage()) {
    <div class="error-banner">
      <p>{{ errorMessage() }}</p>
    </div>
  }

  <!-- Dataset Grid Component -->
  @if (!isLoading() && datasets().length > 0) {
    <app-dataset-grid [datasets]="datasets()" />
  }

  <!-- Footer Component -->
  <app-footer />
</div>
